<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M. PADEL | حجز الملاعب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #060b14;
      --glass-bg: rgba(16, 28, 48, 0.55);
      --glass-border: rgba(255, 255, 255, 0.12);
      --primary: #00ff87;
      --primary-glow: rgba(0, 255, 135, 0.35);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --slot-bg: rgba(255, 255, 255, 0.04);
      --slot-border: rgba(255, 255, 255, 0.08);
      --booked-bg: rgba(239, 68, 68, 0.08);
      --booked-border: rgba(239, 68, 68, 0.25);
      --booked-text: #ef4444;
      --expired-bg: rgba(255, 255, 255, 0.02);
      --expired-border: rgba(255, 255, 255, 0.04);
      --expired-text: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(at 10% 15%, rgba(0, 255, 135, 0.12) 0px, transparent 50%),
        radial-gradient(at 90% 85%, rgba(20, 110, 245, 0.18) 0px, transparent 55%),
        radial-gradient(circle at 50% 50%, #0d1a2d 0%, #050911 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 14px;
      color: var(--text-main);
    }

    .booking-card {
      background: var(--glass-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 30px;
      width: 100%;
      max-width: 440px;
      padding: 28px 20px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .brand-title {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: block;
    }

    .days-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 4px 2px 14px 2px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }
    .days-scroll::-webkit-scrollbar {
      display: none;
    }

    .day-chip {
      flex: 0 0 74px;
      padding: 12px 0;
      background: var(--slot-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--slot-border);
      border-radius: 18px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .day-chip .day-name {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .day-chip .day-num {
      font-size: 16px;
      font-weight: 900;
      color: #fff;
    }
    .day-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 18px var(--primary-glow);
    }
    .day-chip.active .day-name,
    .day-chip.active .day-num {
      color: #05140d;
      font-weight: 900;
    }
    .day-chip.is-today {
      border-color: var(--primary);
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .slot-btn {
      background: var(--slot-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--slot-border);
      border-radius: 16px;
      padding: 12px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
    }

    .slot-btn .slot-time-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      direction: rtl !important;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .slot-btn .slot-status {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
    }

    .slot-btn.selected {
      background: rgba(0, 255, 135, 0.18);
      border-color: var(--primary);
      box-shadow: 0 0 16px rgba(0, 255, 135, 0.35);
    }

    .slot-btn.booked {
      background: var(--booked-bg);
      border-color: var(--booked-border);
      cursor: pointer;
    }
    .slot-btn.booked .slot-time-box {
      color: #94a3b8;
      text-decoration: line-through;
    }
    .slot-btn.booked .slot-status {
      color: var(--booked-text);
    }

    .slot-btn.expired {
      background: var(--expired-bg);
      border-color: var(--expired-border);
      cursor: pointer;
      opacity: 0.35;
    }
    .slot-btn.expired .slot-time-box {
      color: var(--expired-text);
      text-decoration: line-through;
    }
    .slot-btn.expired .slot-status {
      color: var(--expired-text);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-anim {
      animation: shake 0.35s ease-in-out;
    }

    .input-group {
      margin-bottom: 14px;
    }
    .input-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--slot-border);
      border-radius: 16px;
      padding: 14px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .input-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(0, 255, 135, 0.2);
    }

    .price-container {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }
    .price-tag {
      display: none;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--primary);
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(0, 255, 135, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 255, 135, 0.2);
      width: fit-content;
    }

    .submit-btn {
      position: relative;
      width: 100%;
      background: var(--primary);
      color: #05140d;
      border: none;
      border-radius: 18px;
      padding: 16px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 22px var(--primary-glow);
      transition: all 0.2s ease;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .submit-btn.loading {
      background: linear-gradient(
        90deg,
        #00ff87 0%,
        #00e67a 25%,
        #70ffba 50%,
        #00e67a 75%,
        #00ff87 100%
      );
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite linear;
      box-shadow: 0 0 25px var(--primary-glow);
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .footer-section {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.2s ease;
    }
    .info-link:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
    }

    .social-label {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .social-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.2s ease;
    }
    .social-btn:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }
    .social-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .social-btn.instagram svg {
      fill: #e1306c;
    }
    .social-btn.whatsapp svg {
      fill: #25d366;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-box {
      background: rgba(18, 30, 49, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 255, 135, 0.35);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px var(--primary-glow);
      border-radius: 26px;
      padding: 30px 20px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .modal-icon {
      font-size: 48px;
      margin-bottom: 14px;
      display: block;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 10px;
    }
    .modal-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 22px;
    }
    .modal-close-btn {
      width: 100%;
      background: var(--primary);
      color: #05140d;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4OG-Ku3cnKExXU5jSFW8l3DWE15-9x7upZBg2wryBKOfHA2G7bbka52-BVdD5Io_g/exec";
    
    const SLOTS_CONFIG = [
      { id: 0, text: "06:00 م - 07:00 م", tStart: "06:00 م", tEnd: "07:00 م", startHour: 18 },
      { id: 1, text: "07:00 م - 08:00 م", tStart: "07:00 م", tEnd: "08:00 م", startHour: 19 },
      { id: 2, text: "08:00 م - 09:00 م", tStart: "08:00 م", tEnd: "09:00 م", startHour: 20 },
      { id: 3, text: "09:00 م - 10:00 م", tStart: "09:00 م", tEnd: "10:00 م", startHour: 21 },
      { id: 4, text: "10:00 م - 11:00 م", tStart: "10:00 م", tEnd: "11:00 م", startHour: 22 },
      { id: 5, text: "11:00 م - 12:00 ص", tStart: "11:00 م", tEnd: "12:00 ص", startHour: 23 },
      { id: 6, text: "12:00 ص - 01:00 ص", tStart: "12:00 ص", tEnd: "01:00 ص", startHour: 24 },
      { id: 7, text: "01:00 ص - 02:00 ص", tStart: "01:00 ص", tEnd: "02:00 ص", startHour: 25 }
    ];

    let selectedDate = "";
    let isTodayDate = true;
    let selectedIndices = [];
    let bookedSlots = [];

    const daysList = document.getElementById("daysList");
    const slotsGrid = document.getElementById("slotsGrid");
    const custName = document.getElementById("custName");
    const custPhone = document.getElementById("custPhone");
    const priceDisplay = document.getElementById("priceDisplay");
    const submitBtn = document.getElementById("submitBooking");
    const btnText = document.getElementById("btnText");
    const successModal = document.getElementById("successModal");

    function triggerHaptic() {
      if ("vibrate" in navigator) {
        navigator.vibrate(50);
      }
    }

    function initDays() {
      const dayNames = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
      const now = new Date();
      daysList.innerHTML = "";

      for (let i = 0; i < 7; i++) {
        const d = new Date();
        d.setDate(now.getDate() + i);
        const dateStr = d.toISOString().split("T")[0];
        const dayTitle = i === 0 ? "اليوم" : dayNames[d.getDay()];

        const chip = document.createElement("div");
        chip.className = `day-chip ${i === 0 ? "active is-today" : ""}`;
        chip.innerHTML = `
          <div class="day-name">${dayTitle}</div>
          <div class="day-num">${d.getDate()}/${d.getMonth() + 1}</div>
        `;
        chip.onclick = () => selectDate(dateStr, i === 0, chip);
        daysList.appendChild(chip);

        if (i === 0) {
          selectedDate = dateStr;
          isTodayDate = true;
        }
      }
      fetchBookedSlots();
    }

    function selectDate(dateStr, isToday, element) {
      document.querySelectorAll(".day-chip").forEach(c => c.classList.remove("active"));
      element.classList.add("active");
      selectedDate = dateStr;
      isTodayDate = isToday;
      selectedIndices = [];
      updateUI();
      fetchBookedSlots();
    }

    async function fetchBookedSlots() {
      slotsGrid.innerHTML = "<div style='grid-column: span 2; text-align:center; padding:15px; font-size:13px; color:#94a3b8;'>جاري جلب الأوقات...</div>";
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getSlots&date=${selectedDate}`);
        bookedSlots = await res.json();
      } catch (e) {
        bookedSlots = [];
      }
      renderSlots();
    }

    function isSlotExpired(slotHour) {
  if (!isTodayDate) return false;
  const now = new Date();
  let currentHour = now.getHours();

  // فقط الساعات (12 ص، 1 ص، 2 ص) هي التي تُعتبر امتداداً لسهرة اليوم السابق
  if (currentHour >= 0 && currentHour < 3) {
    currentHour += 24;
  }

  // إذا كانت الساعة من 3 صباحاً حتى قبل المغرب، اليوم لم يبدأ بعد ولا يوجد أي وقت منتهي
  if (currentHour < 18) {
    return false;
  }

  return currentHour >= slotHour;
}

    function renderSlots() {
      slotsGrid.innerHTML = "";

      SLOTS_CONFIG.forEach(slot => {
        const isBooked = bookedSlots.includes(slot.text);
        const expired = isSlotExpired(slot.startHour);
        const isSelected = selectedIndices.includes(slot.id);

        const div = document.createElement("div");
        let statusClass = "";
        let statusText = "متاح";

        if (isBooked) {
          statusClass = "booked";
          statusText = "محجوز";
        } else if (expired) {
          statusClass = "expired";
          statusText = "منتهية";
        } else if (isSelected) {
          statusClass = "selected";
          statusText = "تم التحديد";
        }

        div.className = `slot-btn ${statusClass}`;
        
        div.innerHTML = `
          <div class="slot-time-box">
            <span>${slot.tStart}</span>
            <span>-</span>
            <span>${slot.tEnd}</span>
          </div>
          <span class="slot-status">${statusText}</span>
        `;

        div.onclick = () => {
          if (isBooked || expired) {
            triggerHaptic();
            div.classList.remove("shake-anim");
            void div.offsetWidth;
            div.classList.add("shake-anim");
          } else {
            handleSlotSelection(slot.id);
          }
        };

        slotsGrid.appendChild(div);
      });
      updateUI();
    }

    function handleSlotSelection(id) {
      if (selectedIndices.includes(id)) {
        selectedIndices = selectedIndices.filter(i => i !== id);
      } else {
        if (selectedIndices.length === 0) {
          selectedIndices.push(id);
        } else {
          const min = Math.min(...selectedIndices);
          const max = Math.max(...selectedIndices);
          if (id === min - 1 || id === max + 1) {
            selectedIndices.push(id);
          } else {
            selectedIndices = [id];
          }
        }
      }
      renderSlots();
    }

    custPhone.addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
      updateUI();
    });

    custName.addEventListener("input", updateUI);

    function updateUI() {
      const hoursCount = selectedIndices.length;
      const priceTotal = (hoursCount * 20000).toLocaleString("en-US");

      if (hoursCount > 0) {
        priceDisplay.style.display = "block";
        priceDisplay.innerText = `المبلغ الإجمالي: ${priceTotal} د.ع (${hoursCount} ${hoursCount === 1 ? 'ساعة' : hoursCount === 2 ? 'ساعتين' : 'ساعات'})`;
      } else {
        priceDisplay.style.display = "none";
      }

      const trimmedName = custName.value.trim();
      const hasTwoWords = trimmedName.split(/\s+/).filter(w => w.length > 0).length >= 2;
      const isPhoneValid = /^07[0-9]{9}$/.test(custPhone.value.trim());

      if (hoursCount > 0 && hasTwoWords && isPhoneValid) {
        submitBtn.disabled = false;
        btnText.innerText = `تأكيد حجز (${hoursCount} ${hoursCount === 1 ? 'ساعة' : hoursCount === 2 ? 'ساعتين' : 'ساعات'})`;
      } else {
        submitBtn.disabled = true;
        if (hoursCount === 0) btnText.innerText = "حدد وقتاً للحجز";
        else if (!hasTwoWords) btnText.innerText = "يرجى كتابة الاسم ثنائياً على الأقل";
        else if (!isPhoneValid) btnText.innerText = "أدخل رقم هاتف صحيح يبدأ بـ 07 من 11 رقم";
      }
    }

    submitBtn.onclick = async () => {
      submitBtn.disabled = true;
      submitBtn.classList.add("loading");
      btnText.innerText = "جاري إرسال الحجز...";

      selectedIndices.sort((a, b) => a - b);
      for (let id of selectedIndices) {
        const slotText = SLOTS_CONFIG.find(s => s.id === id).text;
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            date: selectedDate,
            slot: slotText,
            name: custName.value.trim(),
            phone: custPhone.value.trim()
          })
        });
      }

      submitBtn.classList.remove("loading");
      successModal.style.display = "flex";
      selectedIndices = [];
      custName.value = "";
      custPhone.value = "";
      fetchBookedSlots();
    };

    function closeModal() {
      successModal.style.display = "none";
    }

    successModal.onclick = (e) => {
      if (e.target === successModal) {
        closeModal();
      }
    };

    initDays();
  </script>
</body>
</html>
