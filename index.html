<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M. PADEL | حجز الملاعب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #132742 0%, #080e18 100%);
      --card-bg: rgba(18, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #00ff87;
      --primary-glow: rgba(0, 255, 135, 0.35);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --slot-bg: rgba(255, 255, 255, 0.04);
      --slot-border: rgba(255, 255, 255, 0.07);
      --booked-bg: rgba(239, 68, 68, 0.08);
      --booked-border: rgba(239, 68, 68, 0.2);
      --booked-text: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 14px;
      color: var(--text-main);
    }

    .booking-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      width: 100%;
      max-width: 440px;
      padding: 28px 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .brand-title {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      color: #fff;
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: block;
    }

    .days-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 4px 2px 14px 2px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }
    .days-scroll::-webkit-scrollbar {
      display: none;
    }

    .day-chip {
      flex: 0 0 74px;
      padding: 12px 0;
      background: var(--slot-bg);
      border: 1px solid var(--slot-border);
      border-radius: 18px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .day-chip .day-name {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .day-chip .day-num {
      font-size: 16px;
      font-weight: 900;
      color: #fff;
    }
    .day-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 16px var(--primary-glow);
    }
    .day-chip.active .day-name,
    .day-chip.active .day-num {
      color: #05140d;
      font-weight: 900;
    }
    .day-chip.is-today {
      border-color: var(--primary);
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .slot-btn {
      background: var(--slot-bg);
      border: 1px solid var(--slot-border);
      border-radius: 16px;
      padding: 12px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slot-btn .slot-time {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      direction: ltr;
      unicode-bidi: isolate;
    }
    .slot-btn .slot-status {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
    }

    .slot-btn.selected {
      background: rgba(0, 255, 135, 0.18);
      border-color: var(--primary);
      box-shadow: 0 0 14px rgba(0, 255, 135, 0.3);
    }

    .slot-btn.booked {
      background: var(--booked-bg);
      border-color: var(--booked-border);
      cursor: not-allowed;
      opacity: 0.55;
    }
    .slot-btn.booked .slot-time {
      color: #64748b;
      text-decoration: line-through;
    }
    .slot-btn.booked .slot-status {
      color: var(--booked-text);
    }

    .input-group {
      margin-bottom: 14px;
    }
    .input-group input {
      width: 100%;
      background: var(--slot-bg);
      border: 1px solid var(--slot-border);
      border-radius: 16px;
      padding: 14px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .input-group input:focus {
      border-color: var(--primary);
    }

    .price-tag {
      display: none;
      text-align: center;
      font-size: 15px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 14px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(0, 255, 135, 0.08);
      border: 1px solid rgba(0, 255, 135, 0.15);
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: #05140d;
      border: none;
      border-radius: 18px;
      padding: 16px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 20px var(--primary-glow);
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .footer-section {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }
    .info-link:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
    }
    .info-link span.icon {
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="booking-card">
    <div class="brand-title">M. PADEL</div>

    <span class="section-label">اختر يوم الحجز</span>
    <div class="days-scroll" id="daysList"></div>

    <span class="section-label">الأوقات المتاحة (يمكنك تحديد عدة ساعات)</span>
    <div class="slots-grid" id="slotsGrid"></div>

    <div class="input-group">
      <span class="section-label">الاسم الكامل</span>
      <input type="text" id="custName" placeholder="اكتب اسمك الثنائي أو الثلاثي">
    </div>

    <div class="input-group">
      <span class="section-label">رقم الهاتف (واتساب)</span>
      <input type="tel" id="custPhone" placeholder="07XXXXXXXXX" maxlength="11">
    </div>

    <div class="price-tag" id="priceDisplay"></div>

    <button class="submit-btn" id="submitBooking" disabled>
      <span>حدد وقتاً للحجز</span>
    </button>

    <div class="footer-section">
      <a href="https://maps.app.goo.gl/Tv4WXvaq5y5mmBQt8" target="_blank" class="info-link">
        <span class="icon">📍</span>
        <span>النجف الأشرف - قرية الغدير الأولى (شارع السنتر)</span>
      </a>

      <a href="https://wa.me/9647831104365" target="_blank" class="info-link">
        <span class="icon">💬</span>
        <span>تواصل معنا عبر الواتساب (07831104365)</span>
      </a>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4OG-Ku3cnKExXU5jSFW8l3DWE15-9x7upZBg2wryBKOfHA2G7bbka52-BVdD5Io_g/exec";
    
    const SLOTS = [
      "06:00 م - 07:00 م",
      "07:00 م - 08:00 م",
      "08:00 م - 09:00 م",
      "09:00 م - 10:00 م",
      "10:00 م - 11:00 م",
      "11:00 م - 12:00 ص",
      "12:00 ص - 01:00 ص",
      "01:00 ص - 02:00 ص"
    ];

    let selectedDate = "";
    let selectedSlots = [];
    let bookedSlots = [];

    const daysList = document.getElementById("daysList");
    const slotsGrid = document.getElementById("slotsGrid");
    const custName = document.getElementById("custName");
    const custPhone = document.getElementById("custPhone");
    const priceDisplay = document.getElementById("priceDisplay");
    const submitBtn = document.getElementById("submitBooking");

    function initDays() {
      const dayNames = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
      const now = new Date();
      daysList.innerHTML = "";

      for (let i = 0; i < 7; i++) {
        const d = new Date();
        d.setDate(now.getDate() + i);
        const dateStr = d.toISOString().split("T")[0];
        const dayTitle = i === 0 ? "اليوم" : dayNames[d.getDay()];

        const chip = document.createElement("div");
        chip.className = `day-chip ${i === 0 ? "active is-today" : ""}`;
        chip.innerHTML = `
          <div class="day-name">${dayTitle}</div>
          <div class="day-num">${d.getDate()}/${d.getMonth() + 1}</div>
        `;
        chip.onclick = () => selectDate(dateStr, chip);
        daysList.appendChild(chip);

        if (i === 0) selectedDate = dateStr;
      }
      fetchBookedSlots();
    }

    function selectDate(dateStr, element) {
      document.querySelectorAll(".day-chip").forEach(c => c.classList.remove("active"));
      element.classList.add("active");
      selectedDate = dateStr;
      selectedSlots = [];
      updateUI();
      fetchBookedSlots();
    }

    async function fetchBookedSlots() {
      slotsGrid.innerHTML = "<div style='grid-column: span 2; text-align:center; padding:15px; font-size:13px; color:#94a3b8;'>جاري جلب الأوقات...</div>";
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getSlots&date=${selectedDate}`);
        bookedSlots = await res.json();
      } catch (e) {
        bookedSlots = [];
      }
      renderSlots();
    }

    function renderSlots() {
      slotsGrid.innerHTML = "";
      SLOTS.forEach(slot => {
        const isBooked = bookedSlots.includes(slot);
        const isSelected = selectedSlots.includes(slot);
        const div = document.createElement("div");
        div.className = `slot-btn ${isBooked ? "booked" : ""} ${isSelected ? "selected" : ""}`;
        div.innerHTML = `
          <span class="slot-time">${slot}</span>
          <span class="slot-status">${isBooked ? "محجوز" : (isSelected ? "تم التحديد" : "متاح")}</span>
        `;
        if (!isBooked) {
          div.onclick = () => toggleSlot(slot);
        }
        slotsGrid.appendChild(div);
      });
      updateUI();
    }

    function toggleSlot(slot) {
      if (selectedSlots.includes(slot)) {
        selectedSlots = selectedSlots.filter(s => s !== slot);
      } else {
        selectedSlots.push(slot);
      }
      renderSlots();
    }

    custPhone.addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
      updateUI();
    });

    custName.addEventListener("input", updateUI);

    function updateUI() {
      const hoursCount = selectedSlots.length;
      const priceTotal = (hoursCount * 20000).toLocaleString("en-US");

      if (hoursCount > 0) {
        priceDisplay.style.display = "block";
        priceDisplay.innerText = `المبلغ الإجمالي: ${priceTotal} د.ع (${hoursCount} ${hoursCount === 1 ? 'ساعة' : hoursCount === 2 ? 'ساعتين' : 'ساعات'})`;
      } else {
        priceDisplay.style.display = "none";
      }

      const trimmedName = custName.value.trim();
      const hasTwoWords = trimmedName.split(/\s+/).filter(w => w.length > 0).length >= 2;
      const isPhoneValid = /^07[0-9]{9,10}$/.test(custPhone.value.trim());

      if (hoursCount > 0 && hasTwoWords && isPhoneValid) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `تأكيد حجز (${hoursCount} ${hoursCount === 1 ? 'ساعة' : hoursCount === 2 ? 'ساعتين' : 'ساعات'})`;
      } else {
        submitBtn.disabled = true;
        if (hoursCount === 0) submitBtn.innerHTML = "حدد وقتاً للحجز";
        else if (!hasTwoWords) submitBtn.innerHTML = "يرجى كتابة الاسم ثنائياً على الأقل";
        else if (!isPhoneValid) submitBtn.innerHTML = "أدخل رقم هاتف صحيح يبدأ بـ 07";
      }
    }

    submitBtn.onclick = async () => {
      submitBtn.disabled = true;
      submitBtn.innerHTML = "جاري إرسال الحجز...";

      for (let slot of selectedSlots) {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            date: selectedDate,
            slot: slot,
            name: custName.value.trim(),
            phone: custPhone.value.trim()
          })
        });
      }

      alert("تم استلام حجزك بنجاح! سيتم التواصل معك عبر الواتساب لتأكيد الحجز.");
      selectedSlots = [];
      custName.value = "";
      custPhone.value = "";
      fetchBookedSlots();
    };

    initDays();
  </script>
</body>
</html>
