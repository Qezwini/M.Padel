<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M. PADEL | حجز الملاعب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #132742 0%, #080e18 100%);
      --card-bg: rgba(18, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #00ff87;
      --primary-glow: rgba(0, 255, 135, 0.35);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --slot-bg: rgba(255, 255, 255, 0.04);
      --slot-border: rgba(255, 255, 255, 0.07);
      --booked-bg: rgba(239, 68, 68, 0.08);
      --booked-border: rgba(239, 68, 68, 0.2);
      --booked-text: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 14px;
      color: var(--text-main);
    }

    .booking-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      width: 100%;
      max-width: 440px;
      padding: 28px 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .brand-title {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      color: #fff;
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: block;
    }

    .days-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 4px 2px 14px 2px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }
    .days-scroll::-webkit-scrollbar {
      display: none;
    }

    .day-chip {
      flex: 0 0 74px;
      padding: 12px 0;
      background: var(--slot-bg);
      border: 1px solid var(--slot-border);
      border-radius: 18px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .day-chip .day-name {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .day-chip .day-num {
      font-size: 16px;
      font-weight: 900;
      color: #fff;
    }
    .day-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 16px var(--primary-glow);
    }
    .day-chip.active .day-name,
    .day-chip.active .day-num {
      color: #05140d;
      font-weight: 900;
    }
    .day-chip.is-today {
      border-color: var(--primary);
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .slot-btn {
      background: var(--slot-bg);
      border: 1px solid var(--slot-border);
      border-radius: 16px;
      padding: 12px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .slot-btn .slot-time-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      direction: ltr !important;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .slot-btn .slot-status {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
    }

    .slot-btn.selected {
      background: rgba(0, 255, 135, 0.18);
      border-color: var(--primary);
      box-shadow: 0 0 14px rgba(0, 255, 135, 0.3);
    }

    .slot-btn.booked {
      background: var(--booked-bg);
      border-color: var(--booked-border);
      cursor: not-allowed;
      opacity: 0.55;
    }
    .slot-btn.booked .slot-time-box {
      color: #64748b;
      text-decoration: line-through;
    }
    .slot-btn.booked .slot-status {
      color: var(--booked-text);
    }

    .input-group {
      margin-bottom: 14px;
    }
    .input-group input {
      width: 100%;
      background: var(--slot-bg);
      border: 1px solid var(--slot-border);
      border-radius: 16px;
      padding: 14px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .input-group input:focus {
      border-color: var(--primary);
    }

    .price-tag {
      display: none;
      text-align: center;
      font-size: 15px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 14px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(0, 255, 135, 0.08);
      border: 1px solid rgba(0, 255, 135, 0.15);
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: #05140d;
      border: none;
      border-radius: 18px;
      padding: 16px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 20px var(--primary-glow);
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .footer-section {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }
    .info-link:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
    }

    .social-label {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .social-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }
    .social-btn:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }
    .social-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .social-btn.instagram svg {
      fill: #e1306c;
    }
    .social-btn.whatsapp svg {
      fill: #25d366;
    }
  </style>
</head>
<body>

  <div class="booking-card">
    <div class="brand-title">M. PADEL</div>

    <span class="section-label">اختر يوم الحجز</span>
    <div class="days-scroll" id="daysList"></div>

    <span class="section-label">الأوقات المتاحة (يمكنك تحديد عدة ساعات)</span>
    <div class="slots-grid" id="slotsGrid"></div>

    <div class="input-group">
      <span class="section-label">الاسم الكامل</span>
      <input type="text" id="custName" placeholder="اكتب اسمك الثنائي أو الثلاثي">
    </div>

    <div class="input-group">
      <span class="section-label">رقم الهاتف (واتساب)</span>
      <input type="tel" id="custPhone" placeholder="07XXXXXXXXX" maxlength="11">
    </div>

    <div class="price-tag" id="priceDisplay"></div>

    <button class="submit-btn" id="submitBooking" disabled>
      <span>حدد وقتاً للحجز</span>
    </button>

    <div class="footer-section">
      <a href="https://maps.app.goo.gl/Tv4WXvaq5y5mmBQt8" target="_blank" class="info-link">
        <span>📍</span>
        <span>النجف الأشرف - قرية الغدير الأولى، شارع السنتر</span>
      </a>

      <div class="social-label">للتواصل والاستفسار المباشر:</div>

      <div class="social-row">
        <a href="https://instagram.com/m.padel1" target="_blank" class="social-btn instagram">
          <svg viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
          <span>Instagram</span>
        </a>

        <a href="https://wa.me/message/Z77HDR2RLS2SH1" target="_blank" class="social-btn whatsapp">
          <svg viewBox="0 0 24 24">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
          </svg>
          <span>WhatsApp</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4OG-Ku3cnKExXU5jSFW8l3DWE15-9x7upZBg2wryBKOfHA2G7bbka52-BVdD5Io_g/exec";
    
    // قائمة الأوقات مفصولة لضمان الترتيب المثالي
    const SLOTS_DATA = [
      { start: "06:00 م", end: "07:00 م" },
      { start: "07:00 م", end: "08:00 م" },
      { start: "08:00 م", end: "09:00 م" },
      { start: "09:00 م", end: "10:00 م" },
      { start: "10:00 م", end: "11:00 م" },
      { start: "11:00 م", end: "12:00 ص" },
      { start: "12:00 ص", end: "01:00 ص" },
      { start: "01:00 ص", end: "02:00 ص" }
    ];

    let selectedDate = "";
    let selectedSlots = [];
    let bookedSlots = [];

    const daysList = document.getElementById("daysList");
    const slotsGrid = document.getElementById("slotsGrid");
    const custName = document.getElementById("custName");
    const custPhone = document.getElementById("custPhone");
    const priceDisplay = document.getElementById("priceDisplay");
    const submitBtn = document.getElementById("submitBooking");

    function initDays() {
      const dayNames = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
      const now = new Date();
      daysList.innerHTML = "";

      for (let i = 0; i < 7; i++) {
        const d = new Date();
        d.setDate(now.getDate() + i);
        const dateStr = d.toISOString().split("T")[0];
        const dayTitle = i === 0 ? "اليوم" : dayNames[d.getDay()];

        const chip = document.createElement("div");
        chip.className = `day-chip ${i === 0 ? "active is-today" : ""}`;
        chip.innerHTML = `
          <div class="day-name">${dayTitle}</div>
          <div class="day-num">${d.getDate()}/${d.getMonth() + 1}</div>
        `;
        chip.onclick = () => selectDate(dateStr, chip);
        daysList.appendChild(chip);

        if (i === 0) selectedDate = dateStr;
      }
      fetchBookedSlots();
    }

    function selectDate(dateStr, element) {
      document.querySelectorAll(".day-chip").forEach(c => c.classList.remove("active"));
      element.classList.add("active");
      selectedDate = dateStr;
      selectedSlots = [];
      updateUI();
      fetchBookedSlots();
    }

    async function fetchBookedSlots() {
      slotsGrid.innerHTML = "<div style='grid-column: span 2; text-align:center; padding:15px; font-size:13px; color:#94a3b8;'>جاري جلب الأوقات...</div>";
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getSlots&date=${selectedDate}`);
        bookedSlots = await res.json();
      } catch (e) {
        bookedSlots = [];
      }
      renderSlots();
    }

    function renderSlots() {
      slotsGrid.innerHTML = "";
      SLOTS_DATA.forEach(slotObj => {
        const slotString = `${slotObj.start} - ${slotObj.end}`;
        const isBooked = bookedSlots.includes(slotString);
        const isSelected = selectedSlots.includes(slotString);

        const div = document.createElement("div");
        div.className = `slot-btn ${isBooked ? "booked" : ""} ${isSelected ? "selected" : ""}`;
        
        div.innerHTML = `
          <div class="slot-time-box">
            <span>${slotObj.start}</span>
            <span>-</span>
            <span>${slotObj.end}</span>
          </div>
          <span class="slot-status">${isBooked ? "محجوز" : (isSelected ? "تم التحديد" : "متاح")}</span>
        `;

        if (!isBooked) {
          div.onclick = () => toggleSlot(slotString);
        }
        slotsGrid.appendChild(div);
      });
      updateUI();
    }

    function toggleSlot(slot) {
      if (selectedSlots.includes(slot)) {
        selectedSlots = selectedSlots.filter(s => s !== slot);
      } else {
        selectedSlots.push(slot);
      }
      renderSlots();
    }

    custPhone.addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
      updateUI();
    });

    custName.addEventListener("input", updateUI);

    function updateUI() {
      const hoursCount = selectedSlots.length;
      const priceTotal = (hoursCount * 20000).toLocaleString("en-US");

      if (hoursCount > 0) {
        priceDisplay.style.display = "block";
        priceDisplay.innerText = `المبلغ الإجمالي: ${priceTotal} د.ع (${hoursCount} ${hoursCount === 1 ? 'ساعة' : hoursCount === 2 ? 'ساعتين' : 'ساعات'})`;
      } else {
        priceDisplay.style.display = "none";
      }

      const trimmedName = custName.value.trim();
      const hasTwoWords = trimmedName.split(/\s+/).filter(w => w.length > 0).length >= 2;
      const isPhoneValid = /^07[0-9]{9,10}$/.test(custPhone.value.trim());

      if (hoursCount > 0 && hasTwoWords && isPhoneValid) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `تأكيد حجز (${hoursCount} ${hoursCount === 1 ? 'ساعة' : hoursCount === 2 ? 'ساعتين' : 'ساعات'})`;
      } else {
        submitBtn.disabled = true;
        if (hoursCount === 0) submitBtn.innerHTML = "حدد وقتاً للحجز";
        else if (!hasTwoWords) submitBtn.innerHTML = "يرجى كتابة الاسم ثنائياً على الأقل";
        else if (!isPhoneValid) submitBtn.innerHTML = "أدخل رقم هاتف صحيح يبدأ بـ 07";
      }
    }

    submitBtn.onclick = async () => {
      submitBtn.disabled = true;
      submitBtn.innerHTML = "جاري إرسال الحجز...";

      for (let slot of selectedSlots) {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            date: selectedDate,
            slot: slot,
            name: custName.value.trim(),
            phone: custPhone.value.trim()
          })
        });
      }

      alert("تم استلام حجزك بنجاح! سيتم التواصل معك عبر الواتساب لتأكيد الحجز.");
      selectedSlots = [];
      custName.value = "";
      custPhone.value = "";
      fetchBookedSlots();
    };

    initDays();
  </script>
</body>
</html>
