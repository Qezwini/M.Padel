<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M. PADEL | لوحة التحكم الإدارية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #060b14;
      --glass-bg: rgba(16, 28, 48, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --primary: #00ff87;
      --primary-glow: rgba(0, 255, 135, 0.35);
      --tournament: #ffd700;
      --tournament-glow: rgba(255, 215, 0, 0.35);
      --danger: #ef4444;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(at 10% 15%, rgba(0, 255, 135, 0.1) 0px, transparent 50%),
        radial-gradient(at 90% 85%, rgba(20, 110, 245, 0.15) 0px, transparent 55%),
        radial-gradient(circle at 50% 50%, #0d1a2d 0%, #050911 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 14px;
      color: var(--text-main);
    }

    .login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(6, 11, 20, 0.95);
      backdrop-filter: blur(20px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .admin-card {
      background: var(--glass-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 30px;
      width: 100%;
      max-width: 440px;
      padding: 28px 20px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      margin-bottom: 20px;
    }

    .brand-title {
      text-align: center;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      color: #fff;
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      display: block;
      margin-bottom: 8px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group input, .input-group select {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    .input-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(0, 255, 135, 0.2);
    }

    .action-btn {
      width: 100%;
      background: var(--primary);
      color: #05140d;
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 22px var(--primary-glow);
      transition: all 0.2s ease;
      margin-top: 6px;
    }
    .action-btn.tournament-btn {
      background: var(--tournament);
      box-shadow: 0 8px 22px var(--tournament-glow);
      color: #1a1500;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 20px 0;
    }

    .slots-picker {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .slot-checkbox {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .slot-checkbox.selected {
      background: rgba(0, 255, 135, 0.15);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }

    .alert-box {
      padding: 10px;
      border-radius: 12px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 14px;
      display: none;
    }
    .alert-box.success { background: rgba(0, 255, 135, 0.1); color: var(--primary); border: 1px solid rgba(0, 255, 135, 0.3); }
    .alert-box.error { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

    .stats-card {
      background: rgba(0, 255, 135, 0.06);
      border: 1px solid rgba(0, 255, 135, 0.2);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      margin-bottom: 16px;
    }
    .booking-row-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .delete-booking-btn {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- شاشة الحماية -->
  <div class="login-overlay" id="loginOverlay">
    <div class="admin-card" style="box-shadow: 0 0 40px rgba(0,255,135,0.15);">
      <div class="brand-title">🔒 لوحة تحكم M. PADEL</div>
      <div class="input-group">
        <span class="section-label">أدخل رمز المرور الإداري</span>
        <input type="password" id="adminPin" placeholder="****" maxlength="6">
      </div>
      <button class="action-btn" onclick="checkPin()">دخول للنظام</button>
      <div id="loginError" style="color: var(--danger); font-size: 12px; text-align: center; margin-top: 10px; display: none;">الرمز غير صحيح!</div>
    </div>
  </div>

  <!-- لوحة التحكم -->
  <div class="admin-card" style="max-width: 480px;">
    <div class="brand-title">⚡ M. PADEL Admin</div>
    <div id="alertBox" class="alert-box"></div>

    <!-- عداد الأرباح اليومية -->
    <div class="stats-card">
      <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">دخل اليوم المحدد (المتوقع):</div>
      <div id="dailyRevenue" style="font-size: 18px; font-weight: 900; color: var(--primary);">0 د.ع (0 ساعات)</div>
    </div>

    <!-- 1. سجل الحجوزات وإدارتها -->
    <div style="font-weight: 800; font-size: 14px; color: var(--primary); margin-bottom: 10px;">📋 سجل حجوزات اليوم المختار</div>
    <div class="input-group" style="margin-bottom: 10px;">
      <input type="date" id="viewDate" onchange="loadAdminBookings()">
    </div>
    <div id="bookingsListContainer" style="max-height: 200px; overflow-y: auto; margin-bottom: 16px;">
      <div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 10px;">جاري تحميل الحجوزات...</div>
    </div>

    <div class="divider"></div>

    <!-- 2. إدارة البطولات -->
    <div style="font-weight: 800; font-size: 14px; color: var(--tournament); margin-bottom: 10px;">🏆 إدارة أيام البطولات</div>
    <div class="input-group">
      <input type="date" id="tourDate">
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;">
      <button class="action-btn tournament-btn" onclick="setTournamentStatus(true)" style="margin:0; font-size:13px; padding:12px;">تفعيل كـ بطولة 🟡</button>
      <button class="action-btn" onclick="setTournamentStatus(false)" style="margin:0; font-size:13px; padding:12px; background:rgba(255,255,255,0.06); color:#fff;">إلغاء البطولة 🟢</button>
    </div>

    <div class="divider"></div>

    <!-- 3. الحجز اليدوي الفوري -->
    <div style="font-weight: 800; font-size: 14px; color: var(--primary); margin-bottom: 10px;">📞 حجز يدوي فوري</div>
    <div class="input-group"><input type="date" id="manualDate"></div>
    <div class="input-group"><input type="text" id="manualName" placeholder="اسم الزبون الثنائي"></div>
    <div class="input-group"><input type="tel" id="manualPhone" placeholder="07XXXXXXXXX" maxlength="11"></div>
    
    <span class="section-label">الساعات:</span>
    <div class="slots-picker" id="slotsPicker"></div>

    <button class="action-btn" onclick="submitManualBooking()" id="manualSubmitBtn">تنفيذ الحجز اليدوي</button>
  </div>

  <script>
    const SCRIPT_URL = "ضع_رابط_السكربت_الخاص_بيك_هنا"; // استبدل هذا الرابط برابط Web App الخاص بك
    const ADMIN_PIN = "1234"; // رمز المرور الخاص بك

    const SLOTS_LIST = [
      "06:00 م - 07:00 م", "07:00 م - 08:00 م",
      "08:00 م - 09:00 م", "09:00 م - 10:00 م",
      "10:00 م - 11:00 م", "11:00 م - 12:00 ص",
      "12:00 ص - 01:00 ص", "01:00 ص - 02:00 ص"
    ];

    let selectedSlots = [];

    function checkPin() {
      const pin = document.getElementById("adminPin").value.trim();
      if (pin === ADMIN_PIN) {
        document.getElementById("loginOverlay").style.display = "none";
        initAdminPanel();
      } else {
        document.getElementById("loginError").style.display = "block";
      }
    }

    function initAdminPanel() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById("tourDate").value = today;
      document.getElementById("manualDate").value = today;
      document.getElementById("viewDate").value = today;

      const picker = document.getElementById("slotsPicker");
      picker.innerHTML = "";
      SLOTS_LIST.forEach((slot) => {
        const div = document.createElement("div");
        div.className = "slot-checkbox";
        div.innerText = slot;
        div.onclick = () => {
          if (selectedSlots.includes(slot)) {
            selectedSlots = selectedSlots.filter(s => s !== slot);
            div.classList.remove("selected");
          } else {
            selectedSlots.push(slot);
            div.classList.add("selected");
          }
        };
        picker.appendChild(div);
      });

      loadAdminBookings();
    }

    function showAlert(msg, type = "success") {
      const box = document.getElementById("alertBox");
      box.innerText = msg;
      box.className = `alert-box ${type}`;
      box.style.display = "block";
      setTimeout(() => { box.style.display = "none"; }, 4000);
    }

    async function loadAdminBookings() {
      const date = document.getElementById("viewDate").value;
      const container = document.getElementById("bookingsListContainer");
      const revDisplay = document.getElementById("dailyRevenue");
      
      container.innerHTML = "<div style='text-align: center; color: var(--text-muted); font-size: 12px; padding: 10px;'>جاري التحديث...</div>";

      try {
        const res = await fetch(`${SCRIPT_URL}?action=getAdminBookings&date=${date}`);
        const bookings = await res.json();

        container.innerHTML = "";
        let hoursCount = 0;

        if (!bookings || bookings.length === 0) {
          container.innerHTML = "<div style='text-align: center; color: var(--text-muted); font-size: 12px; padding: 10px;'>لا توجد حجوزات مسجلة في هذا اليوم.</div>";
          revDisplay.innerText = "0 د.ع (0 ساعات)";
          return;
        }

        bookings.forEach(b => {
          if (!String(b.slot).includes("بطولة")) {
            hoursCount++;
          }
          const item = document.createElement("div");
          item.className = "booking-row-item";
          item.innerHTML = `
            <div>
              <div style="color: var(--primary); font-weight: 700;">${b.slot}</div>
              <div style="color: #fff; margin-top: 2px;">${b.name} (${b.phone})</div>
            </div>
            <button class="delete-booking-btn" onclick="deleteBooking(${b.rowIndex})">إلغاء</button>
          `;
          container.appendChild(item);
        });

        const totalMoney = (hoursCount * 20000).toLocaleString("en-US");
        revDisplay.innerText = `${totalMoney} د.ع (${hoursCount} ${hoursCount === 1 ? 'ساعة' : 'ساعات'})`;

      } catch (e) {
        container.innerHTML = "<div style='text-align: center; color: var(--danger); font-size: 12px; padding: 10px;'>تعذر جلب الحجوزات.</div>";
      }
    }

    async function deleteBooking(rowIndex) {
      if (!confirm("هل أنت متأكد من حذف هذا الحجز وإتاحة الوقت مجدداً؟")) return;
      try {
        await fetch(`${SCRIPT_URL}?action=deleteBooking&row=${rowIndex}`);
        showAlert("🗑️ تم حذف الحجز بنجاح!");
        loadAdminBookings();
      } catch (e) {
        showAlert("فشل حذف الحجز", "error");
      }
    }

    async function setTournamentStatus(isTournament) {
      const date = document.getElementById("tourDate").value;
      if (!date) return alert("اختر التاريخ أولاً");

      if (!confirm(isTournament ? `تحويل تاريخ ${date} إلى بطولة؟` : `إلغاء البطولة لتاريخ ${date}؟`)) return;

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "setTournament", date: date, isTournament: isTournament })
        });
        showAlert(isTournament ? "🏆 تم تفعيل البطولة!" : "✅ تم إيقاف البطولة!");
        loadAdminBookings();
      } catch (err) {
        showAlert("خطأ في الاتصال", "error");
      }
    }

    async function submitManualBooking() {
      const date = document.getElementById("manualDate").value;
      const name = document.getElementById("manualName").value.trim();
      const phone = document.getElementById("manualPhone").value.trim();

      if (!date || !name || !phone || selectedSlots.length === 0) {
        alert("يرجى ملء الحقول واختيار ساعة واحدة على الأقل");
        return;
      }

      if (!/^07[0-9]{9}$/.test(phone)) {
        alert("رقم الهاتف غير صحيح");
        return;
      }

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "manualBooking", date: date, slots: selectedSlots, name: name, phone: phone })
        });

        showAlert("✅ تم الحجز اليدوي بنجاح!");
        document.getElementById("manualName").value = "";
        document.getElementById("manualPhone").value = "";
        selectedSlots = [];
        document.querySelectorAll(".slot-checkbox").forEach(el => el.classList.remove("selected"));
        loadAdminBookings();
      } catch (err) {
        showAlert("فشل الحجز", "error");
      }
    }
  </script>
</body>
</html>
